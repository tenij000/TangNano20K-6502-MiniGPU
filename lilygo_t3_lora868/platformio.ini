; ============================================================================
; PlatformIO Project Configuration voor LilyGO TTGO T3 v1.6.1 (868 MHz LoRa)
; ============================================================================
; Gebruik:
;   pio run -t upload
; Of open lilygo_t3_lora868.ino rechtstreeks in Arduino IDE (Board: TTGO LoRa32-OLED -> T3_V1.6.1)

[platformio]
src_dir = .

[env:lilygo_t3_v161_868]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
